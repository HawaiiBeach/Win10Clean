name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Win10Clean.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package build output
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Win10Clean-$tag.zip"
          Compress-Archive -Path "Win10Clean\bin\Release\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
