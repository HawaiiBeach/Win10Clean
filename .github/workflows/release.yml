name: Build and Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Latest Changelog Entry
        shell: pwsh
        run: |
          $content = Get-Content -Path "CHANGELOG.md" -Raw
          if ($content -match '(?ms)(##\s*\[?v?[\d\.]+.*?)(?=\r?\n##\s|\Z)') {
              $matches[1].Trim() | Out-File -FilePath "release_notes.md" -Encoding utf8
          } else {
              Write-Warning "Could not parse CHANGELOG.md."
              New-Item -ItemType File -Path "release_notes.md" -Force
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Win10Clean.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Package build output
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "Win10Clean-$tag.zip"
          Compress-Archive -Path "Win10Clean\bin\Release\*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Win10Clean ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          body_path: release_notes.md
